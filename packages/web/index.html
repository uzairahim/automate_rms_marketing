<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The cream canvas, declared before React mounts so the first paint is
         already the Client's surface rather than a flash of white. -->
    <meta name="theme-color" content="#fffaf0" />
    <!-- Inlined rather than a file: a single clay form on the cream canvas,
         which is the whole mark. Also stops the browser's automatic
         /favicon.ico request 404-ing in the console. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fffaf0'/%3E%3Cdefs%3E%3CradialGradient id='c' cx='35%25' cy='28%25'%3E%3Cstop offset='0' stop-color='%23ffd0b0'/%3E%3Cstop offset='55%25' stop-color='%23ffb084'/%3E%3Cstop offset='100%25' stop-color='%23d98a5c'/%3E%3C/radialGradient%3E%3C/defs%3E%3Cellipse cx='16' cy='17' rx='11' ry='10' fill='url(%23c)'/%3E%3C/svg%3E"
    />
    <title>Social Media Marketing Automation</title>
    <!-- Inter is DESIGN.md's named substitute for Plain Black, which is
         licensed to Clay. If the request fails the stack falls back to the
         platform UI font, which the theme already lists. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html {
        background-color: #fffaf0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
