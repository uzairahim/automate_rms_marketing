name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      # Testcontainers uses the Docker daemon available on the GitHub runner to
      # spin up ephemeral Postgres/Redis for the behavioral suite.
      - run: npm test
